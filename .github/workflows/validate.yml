name: Validate Discovery plugin

"on":
  push:
    branches: [main, "feature/live-adapters-mcp-v030"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate dependency-free core
        run: python -X utf8 tools/validate.py
      - name: Build standalone opt-in package
        run: python -X utf8 tools/build_release.py
      - name: Retain verified release package for Cloud installation
        if: ${{ github.ref == 'refs/heads/main' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudcodex-environment-discovery-package-${{ github.sha }}
          path: dist/cloudcodex-environment-discovery-*.zip
          if-no-files-found: error
          retention-days: 7

  optional-mcp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up SDK-compatible Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install explicit optional MCP profile
        run: python -m pip install -r plugins/cloudcodex-environment-discovery/optional/requirements-mcp.txt
      - name: Validate core and actual SDK stdio server/client
        run: python -X utf8 tools/validate.py --with-mcp
